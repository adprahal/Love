<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gif Card</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        .main-image {
            width: 80%;
            max-width: 600px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
            width: 100%;
            max-width: 800px;
        }
        .grid img {
            width: 100%;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <img src="path/to/your/main-image.gif" alt="Main Gif" class="main-image">
    <div class="grid">
        <img src="path/to/image1.jpg" alt="Image 1">
        <img src="path/to/image2.jpg" alt="Image 2">
        <img src="path/to/image3.jpg" alt="Image 3">
        <img src="path/to/image4.jpg" alt="Image 4">
        <img src="path/to/image5.jpg" alt="Image 5">
        <img src="path/to/image6.jpg" alt="Image 6">
        <img src="path/to/image7.jpg" alt="Image 7">
        <img src="path/to/image8.jpg" alt="Image 8">
    </div>
</body>
</html>
