<!DOCTYPE html>
<html lang="en">

    <title>For Harmeet ❤️</title>
    <style>
        body {
            display: flex;

            background-color: #ffeef8;

        }
        h1 { color: #d63384; margin-bottom: 20px; }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        #yesBtn { background-color: #ff4d6d; color: white; position: relative; z-index: 10; }
        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: absolute;
            transition: 0.1s;
        }
        /* Success Screen Styles */
        #success-content { display: none; }
        .celebration-gif { width: 80%; max-width: 300px; border-radius: 15px; margin-bottom: 20px; }
        .yay-text { color: #d63384; font-size: 1.8rem; font-weight: bold; }
    </style>
</head>

        <div class="buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
