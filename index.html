<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YAY!!!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>💖 YAY!!! 💖</h1>
      <p class="subtitle">Best decision ever 😘</p>
    </header>

    <section class="card">
      <!-- Example image — replace path with your GIF path (ensure correct case & path) -->
      <img class="preview" src="images/disco.gif" alt="disco ball" onerror="this.style.display='none'">
      <div class="label">disco ball</div>

      <!-- Buttons row: No sits next to Yes (No is to the right by default) -->
      <div class="response-row" role="group" aria-label="Confirm">
        <button id="yesBtn" class="btn btn-yes" type="button">Yes</button>
        <button id="noBtn"  class="btn btn-no"  type="button">No</button>
      </div>
    </section>

    <p class="footer-text">I love you ❤️</p>
  </main>

  <script>
    // Small JS to demonstrate behaviour (optional)
    document.getElementById('yesBtn').addEventListener('click', () => {
      alert('You clicked Yes 💖');
    });
    document.getElementById('noBtn').addEventListener('click', () => {
      alert('You clicked No 💔');
    });

    // Example: how to visually swap order without changing DOM:
    // document.querySelector('.response-row').classList.toggle('swap-order');
  </script>
</body>
</html>
