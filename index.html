<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>For Harmeet ❤️</title>
    <style>
        :root{
            --pink:#ffeef8;
            --accent:#d63384;
            --yes:#ff4d6d;
            --no:#adb5bd;
            --card-bg: rgba(255,255,255,0.85);
        }
        html,body{
            height:100%;
            margin:0;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--pink);
            overflow: hidden;
            text-align: center;
        }
        h1 { color: var(--accent); margin: 0 0 12px 0; }
        .buttons { position: relative; width: 100%; height: 120px; pointer-events: none; }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            pointer-events: auto;
        }
        #yesBtn { background-color: var(--yes); color: white; position: relative; z-index: 10; }
        #noBtn {
            background-color: var(--no);
            color: white;
            position: fixed;
            transition: transform 0.12s ease, left 0.18s ease, top 0.18s ease;
            z-index: 20;
            cursor: pointer;
        }

        /* Success Screen Styles (updated to match screenshot format) */
        #success-content {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,238,248,0.95), rgba(255,244,248,0.97));
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 32px;
            box-sizing: border-box;
            flex-direction: column;
            gap: 18px;
        }
        .success-inner {
            width: min(680px, 92vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 28px 20px;
            box-sizing: border-box;
            backdrop-filter: blur(4px);
        }
        .success-title {
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 900;
            color: #111;
            letter-spacing: 1px;
            display:flex;
            align-items:center;
            gap:12px;
        }
        .emoji {
            font-size: 0.9em;
            transform: translateY(2px);
        }
        .success-sub {
            color:#333;
            font-size: clamp(14px, 2.2vw, 18px);
            margin-top: 6px;
        }

        /* Card that holds the gif to mimic screenshot's rounded video thumbnail */
        .gif-card{
            width: min(380px, 72vw);
            height: auto;
            background: var(--card-bg);
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            border: 2px solid rgba(0,0,0,0.06);
        }
        .gif-card img{
            width:100%;
            height:auto;
            display:block;
            border-radius:8px;
            pointer-events:none;
        }
        .love-text {
            color:#222;
            font-size:clamp(14px, 2vw, 18px);
            margin-top: 10px;
            display:flex;
            align-items:center;
            gap:8px;
        }

        /* small flourish for entry */
        .fade-in {
            animation: fadeScale .38s cubic-bezier(.2,.9,.2,1) both;
        }
        @keyframes fadeScale{
            from { opacity:0; transform: scale(.96) translateY(8px); }
            to { opacity:1; transform: scale(1) translateY(0); }
        }

        /* responsive adjustments */
        @media (min-width:900px){
            .success-inner { padding: 36px; gap:16px; }
        }
    </style>
</head>
<body>

    <div id="main-content">
        <h1>Harmeet, will you be mine? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>
    
    <div id="success-content" aria-live="polite" role="dialog">
        <div class="success-inner fade-in" id="success-inner">
            <div class="success-title">
                <span class="emoji">💖</span>
                <span>YAY!!!</span>
                <span class="emoji">💖</span>
            </div>
            <div class="success-sub">Best decision ever 😘</div>

            <div class="gif-card" aria-hidden="false">
                <!-- Disco ball GIF (from user's URL) -->
                <img src="https://gifdb.com/gif/disco-ball-498-x-498-gif-ms4psoth2z2dpjql.html?embed=true" alt="disco ball" />
            </div>

            <div class="love-text">I love you <span style="color:#ff4d6d;font-size:1.05em;">❤️</span></div>
        </div>
    </div>

    <script>
        (function () {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            const mainContent = document.getElementById('main-content');
            const successContent = document.getElementById('success-content');
            const successInner = document.getElementById('success-inner');

            // Ensure the No button starts at a random location
            function placeNoBtnRandom(initial = false) {
                const btnRect = noBtn.getBoundingClientRect();
                const btnW = Math.max(btnRect.width, 60);
                const btnH = Math.max(btnRect.height, 36);
                const padding = 12;

                const maxX = Math.max(window.innerWidth - btnW - padding, padding);
                const maxY = Math.max(window.innerHeight - btnH - padding, padding);

                // Avoid placing too close to the center (where Yes is)
                const avoidCenterX = window.innerWidth / 2;
                const avoidCenterY = window.innerHeight / 2;
                let x, y, tries = 0;
                do {
                    x = Math.floor(Math.random() * (maxX - padding + 1)) + padding;
                    y = Math.floor(Math.random() * (maxY - padding + 1)) + padding;
                    tries++;
                    // break if too many tries
                    if (tries > 30) break;
                } while (Math.hypot(x - avoidCenterX, y - avoidCenterY) < 120); // keep some distance from center

                noBtn.style.left = x + 'px';
                noBtn.style.top = y + 'px';

                if (initial) {
                    // small entrance animation
                    noBtn.style.transform = 'scale(0.95)';
                    setTimeout(() => noBtn.style.transform = 'scale(1)', 120);
                }
            }

            // Move when user hovers over the No button
            noBtn.addEventListener('mouseenter', (e) => {
                placeNoBtnRandom();
            });

            // Also move if the pointer gets too close to the button (proximity-based)
            const PROXIMITY_THRESHOLD = 100;
            document.addEventListener('mousemove', (e) => {
                const rect = noBtn.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const dist = Math.hypot(e.clientX - centerX, e.clientY - centerY);
                if (dist < PROXIMITY_THRESHOLD) {
                    placeNoBtnRandom();
                }
            });

            // Prevent No from being focused via keyboard to avoid accidental clicks
            noBtn.setAttribute('tabindex', '-1');

            // Yes button shows success screen
            yesBtn.addEventListener('click', () => {
                mainContent.style.display = 'none';
                successContent.style.display = 'flex';
                // small reflow animation
                successInner.classList.remove('fade-in');
                void successInner.offsetWidth;
                successInner.classList.add('fade-in');
            });

            // Make sure the No button is placed after layout
            window.addEventListener('load', () => placeNoBtnRandom(true));
            // Reposition on resize so it stays inside viewport
            window.addEventListener('resize', () => {
                const rect = noBtn.getBoundingClientRect();
                if (rect.right > window.innerWidth || rect.bottom > window.innerHeight) {
                    placeNoBtnRandom();
                }
            });
        })();
    </script>
</body>
</html>
