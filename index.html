<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For Harmeet ❤️</title>
<style>
:root{
  --pink:#ffeef8;
  --accent:#d63384;
  --yes:#ff4d6d;
  --no:#adb5bd;
  --card-bg: rgba(255,255,255,0.85);
}

/* Ensure the page can scroll but starts clean */
html, body {
  margin: 0;
  padding: 0;
  background-color: var(--pink);
  font-family: 'Arial', sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center; /* Centers the "Will you be mine" screen */
  min-height: 100vh;
  overflow-x: hidden;
}

/* Initial Screen Styles */
#main-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 10;
}

h1 { color: var(--accent); margin-bottom: 20px; }

.buttons {
  display: flex;
  gap: 14px;
  justify-content: center;
  align-items: center;
  height: 120px;
}

button {
  padding: 15px 30px;
  font-size: 1.2rem;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  font-weight: bold;
  transition: transform 0.1s;
}

#yesBtn { background-color: var(--yes); color: white; }
#noBtn { background-color: var(--no); color: white; position: relative; }

/* SUCCESS SCREEN - FIX FOR CUT IMAGES */
#success-content {
  display: none; /* MUST BE NONE BY DEFAULT */
  flex-direction: column;
  align-items: center;
  justify-content: flex-start; /* Starts from the top so images aren't cut */
  width: 100%;
  padding: 40px 20px;
  box-sizing: border-box;
  background: linear-gradient(180deg, rgba(255,238,248,0.95), rgba(255,244,248,0.97));
}

.success-inner {
  width: 100%;
  max-width: 1000px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.main-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  width: 100%;
}

.image-box {
  background: var(--card-bg);
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.1);
  aspect-ratio: 1 / 1;
  border: 1px solid rgba(0,0,0,0.05);
}

.image-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 8px;
}

.center-column {
  grid-column: 2;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.success-title { font-size: clamp(24px, 5vw, 42px); font-weight: 900; }
.gif-card img { width: 100%; max-width: 300px; border-radius: 10px; }

@media (max-width: 768px) {
  .main-grid { grid-template-columns: 1fr; }
  .center-column { grid-column: 1; grid-row: auto; }
}

.fade-in { animation: fadeIn 0.8s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="main-content">
  <h1>Harmeet, will you be mine? ❤️</h1>
  <div class="buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>
</div>

<div id="success-content">
  <div class="success-inner fade-in">
    <div class="main-grid">
      <div class="image-box"><img src="1.JPG"></div>
      <div class="image-box"><img src="2.jpg"></div>
      <div class="image-box"><img src="3.JPG"></div>
      
      <div class="image-box"><img src="4.JPG"></div>
      
      <div class="center-column">
        <div class="success-title">💖 YAY!!! 💖</div>
        <p>Best decision ever 😘</p>
        <div class="gif-card">
          <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExam0yY3o2NjU2MGRyZjZmaGswZWF2MG00Z2JibTB6bWxrdXlyMGVybSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ka0JauiBhKkSs/giphy.gif">
        </div>
        <p>I love you ❤️</p>
      </div>

      <div class="image-box"><img src="5.jpg"></div>
      <div class="image-box"><img src="6.jpg"></div>
      <div class="image-box"><img src="7.jpg"></div>
      <div class="image-box"><img src="8.jpg"></div>
    </div>
  </div>
</div>

<script>
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const mainContent = document.getElementById('main-content');
  const successContent = document.getElementById('success-content');

  // Move No Button
  noBtn.addEventListener('mouseenter', () => {
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.position = 'absolute';
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  });

  // Handle Yes Click
  yesBtn.addEventListener('click', () => {
    mainContent.style.display = 'none';
    successContent.style.display = 'flex';
    document.body.style.justifyContent = 'flex-start'; // Reset alignment for scrolling
    window.scrollTo(0, 0); // Start at the top
  });
</script>
</body>
</html>
