<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Layout</title>
    <style>
        .fade-in {
            animation: fadeIn 1s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .centered {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="row">
        <img src="image1.jpg" alt="Image 1">
        <img src="image2.jpg" alt="Image 2">
        <img src="image3.jpg" alt="Image 3">
    </div>

    <div class="row centered">
        <img src="image4.jpg" alt="Image 4">
        <div class="gif-card">
            <h2>Your Title</h2>
            <h3>Your Subtitle</h3>
            <p>Your message here.</p>
            <img src="yourgif.gif" alt="Centered GIF">
        </div>
        <img src="image5.jpg" alt="Image 5">
    </div>

    <div class="row">
        <img class="fade-in" src="image6.jpg" alt="Image 6">
        <img class="fade-in" src="image7.jpg" alt="Image 7">
        <img class="fade-in" src="image8.jpg" alt="Image 8">
    </div>
</body>
</html>
